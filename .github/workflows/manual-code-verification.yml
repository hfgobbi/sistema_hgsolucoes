name: Manual Code Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify Node
        if: ${{ hashFiles('package.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then corepack enable; pnpm install --frozen-lockfile; PM=pnpm; elif [ -f yarn.lock ]; then corepack enable; (yarn install --immutable || yarn install --frozen-lockfile); PM=yarn; elif [ -f package-lock.json ]; then npm ci --legacy-peer-deps --no-audit; PM=npm; else npm install --legacy-peer-deps --no-audit; PM=npm; fi
          export PM
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process'); const p=JSON.parse(fs.readFileSync('package.json')); const s=p.scripts||{},pm=process.env.PM||'npm'; let ran=0; for(const n of ['typecheck','test','build']){if(!s[n])continue;ran++;const r=cp.spawnSync(pm,['run',n],{stdio:'inherit',env:{...process.env,CI:'true'}});if(r.status!==0)process.exit(r.status||1);} if(!ran)console.log('No root typecheck/test/build scripts found.');
          NODE
      - name: Setup Python
        if: ${{ hashFiles('requirements.txt', 'pyproject.toml') != '' }}
        uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Verify Python
        if: ${{ hashFiles('requirements.txt', 'pyproject.toml') != '' }}
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -d tests ] && python -c 'import pytest' 2>/dev/null; then python -m pytest -q; fi
      - name: Setup Go
        if: ${{ hashFiles('go.mod') != '' }}
        uses: actions/setup-go@v5
        with: { go-version: stable }
      - name: Verify Go
        if: ${{ hashFiles('go.mod') != '' }}
        run: go test ./...
      - name: Verify Rust
        if: ${{ hashFiles('Cargo.toml') != '' }}
        run: cargo test --locked
      - if: always()
        run: echo "Manual verification finished for ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
